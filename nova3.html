<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI — Created by Rayyan 6P</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050713;
    --panel:#0b1020;
    --panel2:#10172b;
    --border:rgba(255,255,255,.10);
    --text:#f5f7ff;
    --muted:#9ba6c4;
    --accent:#7c5cff;
    --accent2:#00d9ff;
    --user:#18213b;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% 0%,rgba(124,92,255,.20),transparent 35%),
        radial-gradient(circle at 90% 90%,rgba(0,217,255,.10),transparent 30%),
        var(--bg);
    color:var(--text);
    overflow:hidden;
}

.app{
    display:flex;
    width:100%;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:250px;
    background:rgba(7,10,22,.92);
    border-right:1px solid var(--border);
    padding:22px 15px;
    display:flex;
    flex-direction:column;
    z-index:10;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:25px;
}

.logoIcon{
    width:44px;
    height:44px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    box-shadow:0 0 25px rgba(124,92,255,.4);
}

.logoText{
    font-size:22px;
    font-weight:bold;
}

.logoText small{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-top:2px;
    letter-spacing:1px;
}

.newChat{
    width:100%;
    border:1px solid var(--border);
    background:linear-gradient(135deg,rgba(124,92,255,.2),rgba(0,217,255,.08));
    color:white;
    padding:13px;
    border-radius:13px;
    cursor:pointer;
    font-size:14px;
    margin-bottom:22px;
    transition:.2s;
}

.newChat:hover{
    transform:translateY(-2px);
    border-color:rgba(124,92,255,.5);
}

.sectionTitle{
    color:#6f7a9a;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin:8px 10px;
}

.topic{
    padding:11px 12px;
    border-radius:10px;
    color:#b9c1d9;
    font-size:13px;
    margin:2px 0;
}

.topic:hover{
    background:rgba(255,255,255,.05);
    color:white;
}

.sidebarBottom{
    margin-top:auto;
    border-top:1px solid var(--border);
    padding-top:15px;
}

.private{
    color:#7fffb0;
    font-size:12px;
    margin-bottom:8px;
}

.creator{
    color:#9ba6c4;
    font-size:12px;
    line-height:1.5;
}

.creator strong{
    color:white;
}

/* MAIN */

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    position:relative;
}

/* TOPBAR */

.topbar{
    height:65px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    background:rgba(5,7,19,.65);
    backdrop-filter:blur(15px);
    z-index:5;
}

.topTitle{
    font-size:15px;
    font-weight:bold;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    color:#91a0c5;
    font-size:12px;
}

.dot{
    width:8px;
    height:8px;
    background:#45ff91;
    border-radius:50%;
    box-shadow:0 0 12px #45ff91;
}

/* CHAT */

.chat{
    flex:1;
    overflow-y:auto;
    padding:25px 0 120px;
    scroll-behavior:smooth;
}

.chatInner{
    width:min(900px,92%);
    margin:auto;
}

.welcome{
    text-align:center;
    padding:25px 0 35px;
}

.welcome h1{
    font-size:42px;
    margin-bottom:8px;
    background:linear-gradient(90deg,#fff,#9a8cff,#66eaff);
    -webkit-background-clip:text;
    color:transparent;
}

.welcome p{
    color:var(--muted);
    font-size:14px;
}

.messages{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.message{
    display:flex;
    gap:12px;
    animation:appear .25s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.avatar{
    width:36px;
    height:36px;
    flex-shrink:0;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
}

.aiAvatar{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.userAvatar{
    background:#202a46;
}

.bubble{
    max-width:78%;
    padding:13px 16px;
    border-radius:15px;
    line-height:1.6;
    font-size:14px;
    white-space:pre-wrap;
}

.ai .bubble{
    background:rgba(16,23,43,.9);
    border:1px solid var(--border);
}

.user{
    flex-direction:row-reverse;
}

.user .bubble{
    background:var(--user);
    border:1px solid rgba(124,92,255,.15);
}

/* QUICK BUTTONS */

.quick{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:10px 0 25px 48px;
}

.quick button{
    background:rgba(255,255,255,.045);
    color:#c4cbe0;
    border:1px solid var(--border);
    padding:8px 12px;
    border-radius:20px;
    cursor:pointer;
    font-size:12px;
    transition:.2s;
}

.quick button:hover{
    color:white;
    border-color:rgba(124,92,255,.5);
    background:rgba(124,92,255,.10);
}

/* INPUT */

.inputArea{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:18px 20px 20px;
    background:linear-gradient(transparent,var(--bg) 25%);
}

.inputBox{
    width:min(900px,92%);
    margin:auto;
    background:rgba(13,18,35,.96);
    border:1px solid var(--border);
    border-radius:18px;
    display:flex;
    align-items:flex-end;
    padding:9px;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
}

textarea{
    flex:1;
    resize:none;
    background:transparent;
    border:none;
    outline:none;
    color:white;
    font-family:inherit;
    font-size:14px;
    padding:10px;
    max-height:120px;
}

textarea::placeholder{
    color:#68728f;
}

.inputButtons{
    display:flex;
    gap:6px;
}

.iconBtn{
    width:40px;
    height:40px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#151c32;
    color:#aeb8d2;
    cursor:pointer;
    font-size:17px;
}

.iconBtn:hover{
    color:white;
    background:#202945;
}

.send{
    background:linear-gradient(135deg,var(--accent),#5e48e8);
    color:white;
    border:none;
}

.send:hover{
    box-shadow:0 0 18px rgba(124,92,255,.4);
}

/* 3D ORB */

.orbWrap{
    position:fixed;
    right:28px;
    top:85px;
    width:100px;
    height:100px;
    pointer-events:none;
    z-index:3;
    opacity:.8;
}

.orb{
    position:absolute;
    width:55px;
    height:55px;
    left:22px;
    top:22px;
    border-radius:50%;
    background:
        radial-gradient(circle at 30% 25%,white 0 3%,#a998ff 7%,#684dff 35%,#171333 70%);
    box-shadow:
        0 0 20px #7c5cff,
        0 0 50px rgba(124,92,255,.6),
        inset -8px -10px 20px rgba(0,0,0,.55);
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-8px) rotate(8deg)}
}

.ring{
    position:absolute;
    border:1px solid rgba(112,215,255,.6);
    border-radius:50%;
    transform-style:preserve-3d;
}

.r1{
    width:85px;
    height:32px;
    left:7px;
    top:34px;
    transform:rotateX(65deg) rotateZ(15deg);
    animation:spin 4s linear infinite;
}

.r2{
    width:78px;
    height:27px;
    left:11px;
    top:36px;
    transform:rotateY(65deg) rotateZ(-20deg);
    animation:spin2 5s linear infinite;
}

.r3{
    width:92px;
    height:35px;
    left:3px;
    top:32px;
    transform:rotateX(70deg) rotateY(20deg);
    animation:spin 6s linear infinite reverse;
}

@keyframes spin{
    from{transform:rotateX(65deg) rotateZ(0)}
    to{transform:rotateX(65deg) rotateZ(360deg)}
}

@keyframes spin2{
    from{transform:rotateY(65deg) rotateZ(0)}
    to{transform:rotateY(65deg) rotateZ(-360deg)}
}

.thinking .orb{
    animation:
        float 1s ease-in-out infinite,
        pulse .7s infinite alternate;
}

@keyframes pulse{
    from{
        box-shadow:0 0 20px #7c5cff,0 0 50px rgba(124,92,255,.5);
    }
    to{
        box-shadow:0 0 30px #00d9ff,0 0 80px rgba(0,217,255,.8);
    }
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:7px;
}

::-webkit-scrollbar-track{
    background:transparent;
}

::-webkit-scrollbar-thumb{
    background:#242c46;
    border-radius:20px;
}

/* MOBILE */

@media(max-width:750px){
    .sidebar{
        display:none;
    }

    .topbar{
        padding:0 15px;
    }

    .orbWrap{
        right:10px;
        top:75px;
        transform:scale(.7);
        transform-origin:top right;
    }

    .welcome h1{
        font-size:32px;
    }

    .bubble{
        max-width:85%;
    }

    .quick{
        margin-left:0;
    }

    .inputArea{
        padding-left:8px;
        padding-right:8px;
    }

    .inputBox{
        width:100%;
    }
}
</style>
</head>

    speed:{

100 ÷ 2 = 50 km/h.`
    },

    energy:{

            "energy",

`Energy is the ability to cause change or do work.

Examples include:
• Kinetic energy
• Potential energy
• Thermal energy
• Chemical energy
• Electrical energy
• Light energy

Energy can change from one form to another.`
    },

• Neutrons — no electrical charge

The protons and neutrons are found in the nucleus, while electrons occupy regions around it.`

    cell:{

• Cytoplasm

• Carbon dioxide

    dna:{

            "genetics"

/* ---------------------------------------------------------
   CALCULATOR
   --------------------------------------------------------- */

function calculate(text){

    let expression = text
        .replace(/what is/gi,"")
        .replace(/calculate/gi,"")
        .replace(/solve/gi,"")
        .replace(/equals/gi,"")
        .replace(/=/g,"")
        .replace(/x/gi,"*")
        .replace(/÷/g,"/")
        .trim();

    if(!/^[0-9+\-*/().%\s]+$/.test(expression)){
        return null;
    }

    if(!/[0-9]/.test(expression)){
        return null;
    }

    try{

        const result = Function(
            '"use strict"; return (' + expression + ')'
        )();

        if(
            typeof result === "number" &&
            Number.isFinite(result)
        ){
            return `The answer is **${result}** 🧮`;
        }

    }catch(e){}

    return null;
}

/* ---------------------------------------------------------
   CHAT UI
   --------------------------------------------------------- */

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const orbWrap = document.getElementById("orbWrap");


function addMessage(text,type){

    const row = document.createElement("div");

    row.className =
        "message " +
        (type === "user" ? "user" : "ai");

    const avatar = document.createElement("div");

    avatar.className =
        "avatar " +
        (type === "user" ? "userAvatar" : "aiAvatar");

    avatar.textContent =
        type === "user" ? "👤" : "✦";

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);

    messages.appendChild(row);

    chat.scrollTop = chat.scrollHeight;
}


/* ---------------------------------------------------------
   TYPING EFFECT
   --------------------------------------------------------- */

function addTyping(text){

    const row = document.createElement("div");

    row.className = "message ai";

    const avatar = document.createElement("div");

    avatar.className = "avatar aiAvatar";
    avatar.textContent = "✦";

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    row.appendChild(avatar);
    row.appendChild(bubble);

    messages.appendChild(row);

    orbWrap.classList.add("thinking");

    let i = 0;

    const interval = setInterval(()=>{

        bubble.textContent = text.slice(0,i);

        i++;

        chat.scrollTop = chat.scrollHeight;

        if(i > text.length){

            clearInterval(interval);

            orbWrap.classList.remove("thinking");

        }

    },7);

}


/* ---------------------------------------------------------
   SEND MESSAGE
   --------------------------------------------------------- */

function sendMessage(){

    const text = input.value.trim();

    if(!text){
        return;
    }

    addMessage(text,"user");

    input.value = "";
    input.style.height = "auto";

    const answer = getNovaResponse(text);

    setTimeout(()=>{

        addTyping(answer);

        saveChat(text,answer);

    },350);

}

function handleKey(event){

    if(event.key === "Enter" && !event.shiftKey){

/* ---------------------------------------------------------
   VOICE INPUT
   NO VOICE OUTPUT
   --------------------------------------------------------- */

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert(
            "Voice input is not supported by this browser. Try Google Chrome."
        );

        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.start();

    recognition.onstart = function(){

        orbWrap.classList.add("thinking");

    };

    recognition.onresult = function(event){

        const spoken =
            event.results[0][0].transcript;

        input.value = spoken;

        input.style.height = "auto";
        input.style.height =
            Math.min(input.scrollHeight,120) + "px";

    };

    recognition.onerror = function(){

        alert("I couldn't hear that. Please try again.");

    };

    recognition.onend = function(){

        orbWrap.classList.remove("thinking");

    };

}

    orbWrap.style.transform =
